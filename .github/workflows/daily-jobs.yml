name: Daily QA/SDET Job Digest

on:
  schedule:
    # 02:30 UTC == 08:00 IST. Cron is always UTC on GitHub.
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed so the job can commit seen.json back

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run job hunter
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PYTHON_MAIL_TO: ${{ secrets.PYTHON_MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional
        run: python job_hunter.py

      - name: Persist seen-job history and ATS cache
        run: |
          git config user.name "job-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json seen_python.json companies.txt || true
          git commit -m "update seen jobs + ATS cache [skip ci]" || echo "nothing to commit"
          git push || true

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-html
          path: digest.html
          if-no-files-found: ignore
